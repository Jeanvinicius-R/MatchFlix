name: Playback reverify

# Re-checks, a few times a day, whether the VERIFIED playback associations still
# answer at their providers (POST /api/internal/reverify on the deployed site).
# Without the secrets below the job just says "pulado" and succeeds, so forks
# and fresh clones stay green.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   MATCHFLIX_URL  base URL of the site, e.g. https://matchflix.onrender.com
#                  (a repository variable with the same name also works)
#   CRON_SECRET    same value as the CRON_SECRET env var of the site
#
# AGENDAMENTO DESLIGADO de propósito: o endpoint já passou no e2e local (401 sem
# token, 401 com token errado, 200 com o certo), mas ainda não foi validado no
# Render. Só rode manualmente (Actions -> Playback reverify -> Run workflow).
# Para ligar depois de validar, acrescente em "on:":
#   schedule:
#     - cron: "23 */6 * * *"
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: playback-reverify
  cancel-in-progress: false

jobs:
  reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MATCHFLIX_URL: ${{ secrets.MATCHFLIX_URL || vars.MATCHFLIX_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Reverificar associações
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MATCHFLIX_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "pulado: defina os secrets MATCHFLIX_URL e CRON_SECRET para ativar a reverificação."
            exit 0
          fi

          BASE="${MATCHFLIX_URL%/}"
          case "$BASE" in
            https://*|http://*) ;;
            *) echo "::error::MATCHFLIX_URL precisa começar com http:// ou https://"; exit 1 ;;
          esac

          # The header goes through stdin so the secret never shows in the process list.
          # The free Render service sleeps: the first call may need a retry or two.
          # One call checks at most 25 associations (oldest first), so keep calling
          # while a call comes back full: the freshness window (48 h by default)
          # needs the whole catalog re-checked, not just 100 titles a day.
          BODY="$(mktemp)"
          MAX_CALLS=8
          BATCH=25

          for CALL in $(seq 1 "$MAX_CALLS"); do
            STATUS="$(
              printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" |
                curl --silent --show-error --config - \
                  --request POST \
                  --retry 4 --retry-delay 20 --retry-all-errors \
                  --max-time 600 \
                  --output "$BODY" --write-out '%{http_code}' \
                  "$BASE/api/internal/reverify"
            )"

            echo "Chamada $CALL: HTTP $STATUS"
            cat "$BODY"
            echo

            case "$STATUS" in
              200) ;;
              404) echo "pulado: o site não tem CRON_SECRET configurado (endpoint desativado)."; exit 0 ;;
              *) echo "::error::Falha na reverificação (HTTP $STATUS)"; exit 1 ;;
            esac

            CHECKED="$(jq -r '.checked // 0' "$BODY" 2>/dev/null || echo 0)"

            if [ "$CHECKED" -lt "$BATCH" ]; then
              break
            fi
          done

          echo "Reverificação concluída."
