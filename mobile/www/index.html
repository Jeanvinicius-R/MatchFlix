<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>MatchFlix</title>
    <style>
      :root {
        --bg: #070807;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #22c55e;
        --accent-fg: #03140a;
        --danger: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.25rem;
        max-width: 28rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        color: var(--accent);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      label {
        font-size: 0.875rem;
        color: var(--muted);
      }
      input {
        width: 100%;
        margin-top: 0.4rem;
        padding: 0.85rem 0.9rem;
        font-size: 1rem;
        color: var(--fg);
        background: #111311;
        border: 1px solid #2a2d2a;
        border-radius: 0.6rem;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        width: 100%;
        padding: 0.9rem;
        font-size: 1rem;
        font-weight: 600;
        color: var(--accent-fg);
        background: var(--accent);
        border: 0;
        border-radius: 0.6rem;
      }
      #error {
        min-height: 1.25rem;
        font-size: 0.875rem;
        color: var(--danger);
      }
      small {
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main id="setup" hidden>
      <h1>MatchFlix</h1>
      <p>
        Informe o endereço do servidor MatchFlix. Você só precisa fazer isso uma vez neste
        aparelho.
      </p>
      <form id="form" novalidate>
        <label for="url">Endereço do servidor</label>
        <input
          id="url"
          name="url"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="http://192.168.0.10:3000"
        />
        <p id="error" role="alert"></p>
        <button type="submit">Conectar</button>
      </form>
      <small>
        Na rede local use o IP do computador que roda o MatchFlix (ex.:
        <code>192.168.0.10:3000</code>) com o celular no mesmo Wi-Fi. Para acesso pela
        internet, use o endereço público (ex.: <code>https://seu-dominio</code>).
      </small>
    </main>

    <script>
      (function () {
        var KEY = "matchflix.serverUrl";

        function readSaved() {
          try {
            return localStorage.getItem(KEY) || "";
          } catch (e) {
            return "";
          }
        }

        function save(value) {
          try {
            localStorage.setItem(KEY, value);
          } catch (e) {
            /* sem armazenamento: o app só vai pedir o endereço de novo */
          }
        }

        /** Aceita "192.168.0.10:3000", "meu.dominio.com" ou URL completa; devolve URL http(s) ou null. */
        function normalize(raw) {
          var value = (raw || "").trim();
          if (!value) return null;
          if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) {
            var host = value.split(/[/?#]/)[0];
            var local =
              /^(\d{1,3}\.){3}\d{1,3}(:\d+)?$/.test(host) ||
              /^localhost(:\d+)?$/i.test(host) ||
              /\.(local|lan|home)(:\d+)?$/i.test(host) ||
              /^[^.:]+(:\d+)?$/.test(host);
            value = (local ? "http://" : "https://") + value;
          }
          var url;
          try {
            url = new URL(value);
          } catch (e) {
            return null;
          }
          if (url.protocol !== "http:" && url.protocol !== "https:") return null;
          if (!url.hostname) return null;
          return url.origin + (url.pathname === "/" ? "" : url.pathname) + url.search;
        }

        function open(url) {
          window.location.replace(url);
        }

        var params = new URLSearchParams(window.location.search);
        var saved = readSaved();

        if (saved && !params.has("change")) {
          open(saved);
          return;
        }

        var setup = document.getElementById("setup");
        var form = document.getElementById("form");
        var input = document.getElementById("url");
        var error = document.getElementById("error");
        setup.hidden = false;
        input.value = saved;

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          var url = normalize(input.value);
          if (!url) {
            error.textContent =
              "Endereço inválido. Exemplo: http://192.168.0.10:3000";
            return;
          }
          error.textContent = "";
          save(url);
          open(url);
        });
      })();
    </script>
  </body>
</html>
