# Render Blueprint — sobe o app (Docker, usando o Dockerfile da raiz) e um
# Postgres gerenciado numa tacada só. Uso: dashboard do Render → "New +" →
# "Blueprint" → selecione este repositório. Veja o README ("Deploy no
# Render") para os passos manuais que o Blueprint não cobre (migrations,
# TMDB_ACCESS_TOKEN).
databases:
  - name: matchflix-db
    databaseName: matchflix
    user: matchflix
    # Grátis, mas expira em 30 dias (apaga os dados) — troque para um plano
    # pago (ex.: "0.1c-256mb") no painel do Render quando for pra valer.
    plan: free
    region: oregon

services:
  - type: web
    name: matchflix
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Grátis, mas "dorme" após 15 min sem acesso (o próximo acesso demora
    # alguns segundos pra acordar). Troque para "0.5c-512mb" (pago) no
    # painel do Render pra tirar esse delay.
    plan: free
    region: oregon
    # "/login" não depende do banco ter conteúdo cadastrado — diferente da
    # Home ("/"), que falha antes da primeira migration + cadastro de título.
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: matchflix-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXT_PUBLIC_APP_NAME
        value: MatchFlix
      # Preencha no dashboard do Render (Environment) depois do deploy —
      # nunca commitado aqui. Sem ele, a busca/import da TMDB no /admin falha
      # com um erro claro; o resto do site funciona normalmente.
      - key: TMDB_ACCESS_TOKEN
        sync: false
      # Fontes de reprodução por API/domínio público (ver README do
      # projeto e src/services/playback/providers/). Deixe em branco para
      # desativar o provider correspondente — nunca aponte para um serviço
      # sem autorização de uso.
      - key: PLAYBACK_AUTHORIZED_BASE_URL
        sync: false
      # YouTube Data API v3 (oficial). Só funciona com as DUAS preenchidas;
      # a allowlist é decisão de quem opera o site ("embeddable" não prova
      # licença). Vazias = provider desativado, nenhuma chamada ao YouTube.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_ALLOWED_CHANNEL_IDS
        sync: false
