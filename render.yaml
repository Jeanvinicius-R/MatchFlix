# Render Blueprint — sobe o app (Docker, usando o Dockerfile da raiz) e um
# Postgres gerenciado numa tacada só. Uso: dashboard do Render → "New +" →
# "Blueprint" → selecione este repositório. Veja o README ("Deploy no
# Render") para os passos manuais que o Blueprint não cobre (migrations,
# TMDB_ACCESS_TOKEN).
databases:
  - name: matchflix-db
    databaseName: matchflix
    user: matchflix
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: matchflix
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    # "/login" não depende do banco ter conteúdo cadastrado — diferente da
    # Home ("/"), que falha antes da primeira migration + cadastro de título.
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: matchflix-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXT_PUBLIC_APP_NAME
        value: MatchFlix
      # Preencha no dashboard do Render (Environment) depois do deploy —
      # nunca commitado aqui. Sem ele, a busca/import da TMDB no /admin falha
      # com um erro claro; o resto do site funciona normalmente.
      - key: TMDB_ACCESS_TOKEN
        sync: false
      # Fontes de reprodução por API/domínio público (ver AGENTS.md do
      # projeto e src/services/playback/providers/). Deixe em branco para
      # desativar o provider correspondente — nunca aponte para um serviço
      # sem autorização de uso.
      - key: PLAYBACK_AUTHORIZED_BASE_URL
        sync: false
      - key: PLAYBACK_PROVIDER_BASE_URL
        sync: false
